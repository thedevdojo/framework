# Release builds for the devdojo binary.
#
# The old @devdojo/sites npm package downloads these on install, expecting
# assets named `devdojo_<os>_<arch>.tar.gz` on the `v<version>` release
# (see sites/src/engine/binary.js — keep the naming in sync). The release
# workflow then publishes the same binaries to npm as devdojo
# (npm/scripts/packages.mjs, which finds them through dist/artifacts.json).
#
# Cut a release: git tag v0.1.0 && git push origin v0.1.0
version: 2

project_name: devdojo

builds:
  - main: ./cmd/devdojo
    binary: devdojo
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  # tar.gz for every platform — bsdtar ships on Windows 10+ too, and the
  # npm installer extracts all platforms the same way.
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

release:
  draft: false
