name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # npm's provenance: the published packages say which workflow run made them.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # A secret of this repository: an npm token that may publish the
      # devdojo package and the devdojo-<os>-<cpu> packages beside it. Without it the binaries are released and npm is skipped.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The npm packages, at the tag's version: one per platform holding the
      # binary goreleaser just built, then devdojo, which installs
      # the one that fits (npm/scripts/packages.mjs says how).
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node npm/scripts/packages.mjs --version "${GITHUB_REF_NAME#v}" --dist dist --out npm/out
          for dir in npm/out/devdojo-*; do
            (cd "$dir" && npm publish --access public --provenance)
          done
          (cd npm/out/devdojo && npm publish --access public --provenance)
