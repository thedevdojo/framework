name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - run: go vet ./... && test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go test ./blade/scanner -fuzz=FuzzScan -fuzztime=20s
      - run: go test ./blade/parser -fuzz='^FuzzParse$' -fuzztime=20s
      # The HTML syntax: its scanner, its expression rewriter, and the whole
      # pipeline entered through an .html page.
      - run: go test ./blade/htmlscan -fuzz='^FuzzScan$' -fuzztime=20s
      - run: go test ./blade/htmlscan -fuzz='^FuzzExpr$' -fuzztime=20s
      - run: go test ./blade/parser -fuzz='^FuzzParseHTML$' -fuzztime=20s
      - run: go test ./blade/render -fuzz='^FuzzCompileHTML$' -fuzztime=20s
      - run: go test ./blade/convert -fuzz='^FuzzFile$' -fuzztime=20s
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Laravel 11 supports both 8.3 and 8.4; CI pins 8.4 to match the oracle
      # lockfile and local dev.
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - run: cd oracle && composer install --no-interaction --quiet
      - run: cd oracle && php artisan pocketknife:conformance ../fixtures
