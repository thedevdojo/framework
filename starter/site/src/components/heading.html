<Props
    eyebrow=""
    heading=""
    paragraph=""
    :headingLevel="1"
/>

<div class="is-visible mx-auto text-center">
    <If eyebrow>
        <p class="text-xs font-semibold tracking-[0.2em] mb-3 text-muted-foreground/80 uppercase" data-reveal>{{ eyebrow }}</p>
    </If>
    {{-- Level 1 is the page title set large; anything else is an h2. Each tag is written out: the dialect has no string concatenation. --}}
    <If headingLevel="1">
        <h1 class="text-hero font-semibold tracking-[-0.04em] max-w-4xl font-semibold tracking-tight text-balance text-muted-foreground/80 first-line:text-foreground mx-auto" data-reveal>{{ heading }}</h1>
    <Else>
        <h2 class="text-h2 max-w-xl font-semibold tracking-tight text-balance text-muted-foreground/80 first-line:text-foreground mx-auto" data-reveal>{{ heading }}</h2>
    </If>
    <If paragraph>
        <p class="mt-4 max-w-3xl mx-auto text-lg/8 text-balance text-muted-foreground" data-reveal>{{ paragraph }}</p>
    </If>
</div>
