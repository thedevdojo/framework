<Props
    heading="The numbers from the first year"
    :stats="[]"
/>
<!-- Four headline figures in a row with hairlines between them. Clear the heading to hide it. Rows live in src/data/collections/stats.json. -->
<section class="py-20 sm:py-28">
    <div class="mx-auto w-full max-w-6xl px-6 lg:px-8">
        <If heading>
        <h2 class="mb-14 text-center text-h2 font-semibold tracking-tight text-balance text-foreground sm:mb-16" data-reveal>{{ heading }}</h2>
        </If>

        <dl class="grid grid-cols-2 gap-x-6 gap-y-10 sm:grid-cols-4 sm:gap-y-0 sm:divide-x sm:divide-border">
            <Foreach stats="item">
            <div {{ class(['reveal-1' => loop.iteration == 1, 'reveal-2' => loop.iteration == 2, 'reveal-3' => loop.iteration == 3, 'reveal-4' => loop.iteration == 4, 'reveal-5' => loop.iteration == 5, 'reveal-6' => loop.iteration >= 6, 'px-4 text-center']) }} data-reveal>
                <dd class="text-figure font-semibold tracking-tight text-foreground tabular-nums">{{ item.value }}</dd>
                <dt class="mt-2 text-[14px] text-muted-foreground">{{ item.label }}</dt>
            </div>
            </Foreach>
        </dl>
    </div>
</section>
