<Props
    heading="Shift schedules that survive the week"
    intro="Linden builds the roster from your rules, fills the gaps when someone calls out, and tells the right people — not everyone."
    :rows="[]"
/>
<!--
    Feature rows: a left opener (heading, intro), then alternating split rows — copy on one side (small label, title,
    body, a three-line checklist) and a product screenshot on the other, framed as a card on a soft well that runs
    off the outer edge on desktop so the visible slice stays large. Rows come from src/data/collections/featureRows.json
    (points is a plain list of strings), each with its own image; the side alternates by row order.
-->
<section class="overflow-x-clip py-16 sm:py-28" data-feature-02>
    <div class="mx-auto w-full max-w-6xl px-6 lg:px-8">
        <div class="max-w-2xl">
            <h2 class="text-h2 font-semibold tracking-tight text-balance text-foreground" data-reveal>{{ heading }}</h2>
            <p class="reveal-1 mt-5 max-w-[50ch] text-lg/8 text-pretty text-muted-foreground" data-reveal>{{ intro }}</p>
        </div>

        <div class="mt-16 space-y-20 sm:mt-20 sm:space-y-28">
            <Foreach rows="row">
            <div class="grid items-center gap-10 lg:grid-cols-2 lg:gap-20">
                <div {{ class(['lg:order-last' => loop.even]) }} data-reveal>
                    <p class="text-xs font-semibold tracking-[0.2em] text-muted-foreground/80 uppercase">{{ row.label }}</p>
                    <h3 class="mt-3 max-w-[26ch] text-2xl font-semibold tracking-tight text-balance text-foreground">{{ row.title }}</h3>
                    <p class="mt-4 max-w-[52ch] text-[15px]/6 text-pretty text-muted-foreground">{{ row.body }}</p>
                    <ul class="mt-6 space-y-3">
                        <Foreach row.points="point">
                        <li class="flex items-start gap-2.5 text-[15px]/6 text-foreground/78">
                            <svg viewBox="0 0 16 16" class="h-lh size-4 shrink-0 fill-current text-muted-foreground" aria-hidden="true"><path fill-rule="evenodd" d="M12.416 3.376a.75.75 0 0 1 .208 1.04l-5 7.5a.75.75 0 0 1-1.154.114l-3-3a.75.75 0 0 1 1.06-1.06l2.353 2.353 4.493-6.74a.75.75 0 0 1 1.04-.207Z" clip-rule="evenodd"/></svg>
                            <span>{{ point }}</span>
                        </li>
                        </Foreach>
                    </ul>
                </div>

                <!-- The screenshot runs off the outer edge on desktop — right on odd rows, left on even — so the
                     visible slice is large; the stage keeps its rounded corners only on the inner side. -->
                <div {{ class(['reveal-1 rounded-3xl bg-muted/70 p-4 sm:p-6', 'lg:w-[135%] lg:rounded-r-none lg:pr-0' => loop.odd, 'lg:ml-[-35%] lg:w-[135%] lg:rounded-l-none lg:pl-0' => loop.even]) }} data-reveal>
                    <div {{ class(['overflow-hidden rounded-2xl border border-border bg-card shadow-2xl shadow-foreground/5', 'lg:rounded-r-none lg:border-r-0' => loop.odd, 'lg:rounded-l-none lg:border-l-0' => loop.even]) }}>
                        <img src="{{ row.image }}" alt="{{ row.imageAlt }}" width="1600" height="1200" class="block h-auto w-full" loading="lazy">
                    </div>
                </div>
            </div>
            </Foreach>
        </div>
    </div>
</section>
