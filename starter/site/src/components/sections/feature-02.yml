title: Features — alternating rows
description: Left opener, then three split rows that alternate sides — copy with a checklist beside a product screenshot
category: features
fields:
    heading:
        type: text
        label: Heading
        default: "Shift schedules that survive the week"
        required: true
    intro:
        type: textarea
        label: Intro
        rows: 3
        default: "Linden builds the roster from your rules, fills the gaps when someone calls out, and tells the right people — not everyone."
    rows:
        type: repeater
        label: Rows
        source: "collections.featureRows"
        description: Rows alternate sides automatically. The checklist lines are the row's points list, edited in the Content table; each row has its own screenshot, which runs off the outer edge on desktop (keep what matters in the inner two-thirds).
        add_button_label: "Add row"
        item_label: title
        sub_fields:
            label:
                type: text
                label: Small label
                default: "Feature"
            title:
                type: text
                label: Title
                default: "What this feature does"
            body:
                type: textarea
                label: Body
                rows: 3
                default: "One or two sentences on what changes for the team."
            image:
                type: image
                label: Image
                default: "/images/shot-editor.jpg"
            imageAlt:
                type: text
                label: Image alt text
                default: "A screenshot of the feature"
